<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yummy | Query Form</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(0, 0, 0, 0.58), rgba(0, 0, 0, 0.58)),
        url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1950&q=80")
        no-repeat center center / cover fixed;
      color: #333;
      padding: 90px 20px 40px;
      font-size: 16px;
      line-height: 1.6;
    }

    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeInScale {
      from { transform: scale(0.97); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes popIn {
      from { transform: scale(0.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .query-nav {
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      background: #222;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
      animation: slideDown 0.6s ease-out;
    }

    .query-nav .nav-inner {
      width: min(1100px, 100%);
      min-height: 62px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
    }

    .query-nav a {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #fff;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 4px;
      transition: background 0.2s ease;
    }

    .query-nav a:hover {
      background: #ce1212;
    }

    .content {
      width: min(700px, 100%);
      margin: 20px auto 24px;
      text-align: center;
      animation: fadeInScale 0.8s ease both;
    }

    .content h1 {
      color: #fff;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .content p {
      color: #f1f1f1;
      margin: 0 auto;
    }

    .query-card {
      width: min(620px, 100%);
      margin: 0 auto;
      padding: 28px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
      animation: fadeInScale 0.9s ease both;
    }

    .query-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .query-form input,
    .query-form select,
    .query-form textarea {
      width: 100%;
      min-width: 0;
      padding: 12px 13px;
      border: 1px solid #d6d6d6;
      border-radius: 6px;
      background: #fff;
      color: #333;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .query-form input:focus,
    .query-form select:focus,
    .query-form textarea:focus {
      border-color: #ce1212;
      box-shadow: 0 0 0 3px rgba(206, 18, 18, 0.1);
    }

    .query-form .full-width {
      grid-column: 1 / -1;
    }

    .query-form textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-actions {
      grid-column: 1 / -1;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 4px;
    }

    .form-actions button {
      min-width: 120px;
      padding: 11px 20px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: #ce1212;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .form-actions button:hover {
      background: #a90f0f;
      transform: translateY(-2px);
    }

    .form-actions button[type="reset"] {
      background: #555;
    }

    .form-actions button[type="reset"]:hover {
      background: #333;
    }

    #results {
      width: min(620px, 100%);
      margin: 18px auto 0;
      padding: 14px 18px;
      border-radius: 8px;
      background: rgba(30, 30, 30, 0.88);
      color: #fff;
      text-align: center;
      overflow-wrap: anywhere;
    }

    #results p {
      color: #fff;
      margin: 0;
    }

    #results p.success {
      color: #d9f7df;
      animation: popIn 0.35s ease-out;
    }

    @media (max-width: 600px) {
      body {
        padding: 82px 14px 28px;
      }

      .query-card {
        padding: 20px 16px;
      }

      .query-form {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .query-form .full-width,
      .form-actions {
        grid-column: 1;
      }
    }
  </style>
</head>

<body>
  <nav class="query-nav">
    <div class="nav-inner">
      <a href="index.html"><i class="fa fa-home"></i> Home</a>
    </div>
  </nav>

  <main>
    <div class="content">
      <h1>Yummy Query Form</h1>
      <p>Welcome to the Yummy Query Form. Please fill out the form below with your details and query.</p>
    </div>

    <div class="query-card">
      <form id="queryForm" class="query-form">
        <input type="text" placeholder="Enter your name" id="name" name="name" autocomplete="name" required>
        <input type="email" placeholder="Enter your email" id="email" name="email" autocomplete="email" required>
        <input type="tel" placeholder="Enter your phone number" id="phone" name="phone" autocomplete="tel" required>
        <input type="text" placeholder="Enter your address" id="address" name="address" autocomplete="street-address" required>
        <input type="text" placeholder="Enter your city" id="city" name="city" autocomplete="address-level2" required>
        <input type="text" placeholder="Enter your state" id="state" name="state" autocomplete="address-level1" required>

        <select id="category" name="category" class="full-width" required>
          <option value="">Select a category</option>
          <option value="general">General Inquiry</option>
          <option value="feedback">Feedback</option>
          <option value="support">Support</option>
          <option value="other">Other</option>
        </select>

        <textarea id="query" name="query" class="full-width" placeholder="Enter your query" required></textarea>

        <div class="form-actions">
          <button type="submit">Submit</button>
          <button type="reset">Reset</button>
        </div>
      </form>
    </div>

    <div id="results" aria-live="polite">
      <p id="resultMessage">Your query will appear here after submission.</p>
    </div>
  </main>

  <script>
    const queryForm = document.getElementById("queryForm");
    const resultBox = document.getElementById("results");

    queryForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const queryText = document.getElementById("query").value.trim();
      const message = document.createElement("p");
      message.className = "success";
      message.textContent = "You queried: " + queryText;

      resultBox.replaceChildren(message);
    });

    queryForm.addEventListener("reset", function () {
      resultBox.innerHTML = "<p id='resultMessage'>Your query will appear here after submission.</p>";
    });
  </script>
</body>
</html>
